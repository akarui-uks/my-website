<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arcade Vault — akarui_uks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0c0e;
      --surface: #111317;
      --surface-hover: #171a20;
      --border: #232730;
      --border-gold: rgba(212, 175, 55, 0.4);
      --gold: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.2);
      --crimson: #ef4444;
      --text: #ede8df;
      --text-muted: #8b929e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      background-image: 
        radial-gradient(ellipse at 50% 0%, var(--gold-glow), transparent 70%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px;
      background-attachment: fixed;
    }

    .gotisch {
      font-family: 'Grenze Gotisch', Georgia, serif;
    }

    /* Top Bar */
    .arcade-header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .back-btn {
      color: var(--gold);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: #fff;
    }

    .arcade-title {
      font-size: 1.8rem;
      color: var(--gold);
      text-shadow: 0 0 10px var(--gold-glow);
    }

    /* Game Selector Tabs */
    .game-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 6px;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      border-color: var(--gold);
      color: var(--text);
    }

    .tab-btn.active {
      background: #171a20;
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    /* Cabinet Screen Frame */
    .cabinet {
      background: #000;
      border: 2px solid var(--border-gold);
      border-radius: 8px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9), 0 0 25px var(--gold-glow);
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: radial-gradient(circle at 50% 50%, #151820 0%, #050608 100%);
    }

    /* Hud */
    .hud {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .hud span strong {
      color: var(--gold);
    }

    .instruction {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #555b66;
      text-align: center;
      letter-spacing: 0.04em;
    }

    /* Touch Controls for Mobile */
    .mobile-pad {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 320px;
      margin-top: 16px;
    }

    .pad-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--gold);
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .pad-btn:active {
      background: var(--gold);
      color: #000;
    }

    @media (max-width: 600px) {
      .mobile-pad {
        display: grid;
      }
    }
  </style>
</head>
<body>

  <header class="arcade-header">
    <a href="index.html" class="back-btn">← Sanctuary</a>
    <h1 class="arcade-title gotisch">Arcade Vault</h1>
    <span style="color: var(--gold); font-size: 1.1rem;">♰</span>
  </header>

  <div class="game-tabs">
    <button class="tab-btn active" onclick="switchGame('snake')">Serpent (Classic)</button>
    <button class="tab-btn" onclick="switchGame('shooter')">Void Invader</button>
    <button class="tab-btn" onclick="switchGame('pong')">Gothic Pong</button>
  </div>

  <div class="cabinet">
    <canvas id="screen" width="400" height="400"></canvas>
  </div>

  <div class="hud">
    <span>SCORE: <strong id="score-val">0</strong></span>
    <span>HIGH: <strong id="high-val">0</strong></span>
  </div>

  <p class="instruction" id="ctrl-hint">Arrow Keys / WASD to Steer • Wrap through borders allowed</p>

  <div class="mobile-pad">
    <div></div>
    <button class="pad-btn" id="btn-up">▲</button>
    <div></div>
    <button class="pad-btn" id="btn-left">◀</button>
    <button class="pad-btn" id="btn-action">●</button>
    <button class="pad-btn" id="btn-right">▶</button>
    <div></div>
    <button class="pad-btn" id="btn-down">▼</button>
    <div></div>
  </div>

  <script>
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const highVal = document.getElementById('high-val');
    const ctrlHint = document.getElementById('ctrl-hint');

    let currentGame = 'snake';
    let gameState = 'start'; // 'start', 'playing', 'gameover'
    let score = 0;
    let highScores = { snake: 0, shooter: 0, pong: 0 };

    // Load saved highscores
    const saved = localStorage.getItem('omabedor_arcade_scores');
    if (saved) {
      try { highScores = JSON.parse(saved); } catch(e){}
    }

    function updateScore(pts) {
      score = pts;
      scoreVal.textContent = score;
      if (score > highScores[currentGame]) {
        highScores[currentGame] = score;
        localStorage.setItem('omabedor_arcade_scores', JSON.stringify(highScores));
      }
      highVal.textContent = highScores[currentGame];
    }

    // Input state
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === 'Space') {
        if (gameState !== 'playing') initGame();
      }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    canvas.addEventListener('pointerdown', () => {
      if (gameState !== 'playing') initGame();
    });

    // Mobile buttons
    document.getElementById('btn-up').onclick = () => triggerKey('ArrowUp');
    document.getElementById('btn-down').onclick = () => triggerKey('ArrowDown');
    document.getElementById('btn-left').onclick = () => triggerKey('ArrowLeft');
    document.getElementById('btn-right').onclick = () => triggerKey('ArrowRight');
    document.getElementById('btn-action').onclick = () => {
      if (gameState !== 'playing') initGame();
      else keys['Space'] = true;
      setTimeout(() => keys['Space'] = false, 150);
    };

    function triggerKey(code) {
      keys[code] = true;
      setTimeout(() => keys[code] = false, 150);
    }

    function switchGame(gameName) {
      currentGame = gameName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase().includes(gameName.slice(0, 4)));
      });
      gameState = 'start';
      score = 0;
      updateScore(0);
      if (gameName === 'snake') ctrlHint.textContent = 'Arrow Keys / WASD to Steer • Wrap through borders allowed';
      if (gameName === 'shooter') ctrlHint.textContent = 'Left / Right to move • Space or [●] to shoot';
      if (gameName === 'pong') ctrlHint.textContent = 'Up / Down to move paddle • Beat the AI';
    }

    /* ---------------- GAME 1: SERPENT (NOKIA-STYLE WRAP & SLOWER) ---------------- */
    const snakeGrid = 20;
    const gridCols = canvas.width / snakeGrid;
    const gridRows = canvas.height / snakeGrid;
    let snake = [];
    let snakeDir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 10, y: 10 };
    let snakeTimer = 0;

    function initSnake() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      snakeDir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      spawnFood();
      gameState = 'playing';
      updateScore(0);
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * gridCols),
        y: Math.floor(Math.random() * gridRows)
      };
    }

    function updateSnake() {
      if (keys['ArrowUp'] || keys['KeyW']) if (snakeDir.y === 0) nextDir = { x: 0, y: -1 };
      if (keys['ArrowDown'] || keys['KeyS']) if (snakeDir.y === 0) nextDir = { x: 0, y: 1 };
      if (keys['ArrowLeft'] || keys['KeyA']) if (snakeDir.x === 0) nextDir = { x: -1, y: 0 };
      if (keys['ArrowRight'] || keys['KeyD']) if (snakeDir.x === 0) nextDir = { x: 1, y: 0 };

      // Slowed down frame delay for classic Nokia pacing (10 ticks per step)
      snakeTimer++;
      if (snakeTimer < 10) return;
      snakeTimer = 0;

      snakeDir = nextDir;
      let newHeadX = snake[0].x + snakeDir.x;
      let newHeadY = snake[0].y + snakeDir.y;

      // Nokia Border Wrap (Passes straight through walls)
      if (newHeadX < 0) newHeadX = gridCols - 1;
      else if (newHeadX >= gridCols) newHeadX = 0;

      if (newHeadY < 0) newHeadY = gridRows - 1;
      else if (newHeadY >= gridRows) newHeadY = 0;

      const head = { x: newHeadX, y: newHeadY };

      // Self collision check
      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
          gameState = 'gameover';
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        updateScore(score + 10);
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function drawSnake() {
      // Draw Food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.fillRect(food.x * snakeGrid + 3, food.y * snakeGrid + 3, snakeGrid - 6, snakeGrid - 6);
      ctx.shadowBlur = 0;

      // Draw Snake Body
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#ffffff' : '#d4af37';
        ctx.strokeStyle = '#0b0c0e';
        ctx.fillRect(seg.x * snakeGrid + 1, seg.y * snakeGrid + 1, snakeGrid - 2, snakeGrid - 2);
        ctx.strokeRect(seg.x * snakeGrid + 1, seg.y * snakeGrid + 1, snakeGrid - 2, snakeGrid - 2);
      });
    }

    /* ---------------- GAME 2: VOID INVADER (SAFE PASS-THROUGH) ---------------- */
    let playerX = 200;
    let bullets = [];
    let enemies = [];
    let cooldown = 0;

    function initShooter() {
      playerX = 200;
      bullets = [];
      enemies = [];
      cooldown = 0;
      gameState = 'playing';
      updateScore(0);
    }

    function updateShooter() {
      if ((keys['ArrowLeft'] || keys['KeyA']) && playerX > 20) playerX -= 5;
      if ((keys['ArrowRight'] || keys['KeyD']) && playerX < canvas.width - 20) playerX += 5;

      if (cooldown > 0) cooldown--;
      if (keys['Space'] && cooldown === 0) {
        bullets.push({ x: playerX, y: canvas.height - 35 });
        cooldown = 12;
      }

      if (Math.random() < 0.035) {
        enemies.push({ x: Math.random() * (canvas.width - 40) + 20, y: -10, speed: Math.random() * 1.5 + 2 });
      }

      // Update Bullets
      bullets.forEach((b, bi) => {
        b.y -= 7;
        if (b.y < -10) bullets.splice(bi, 1);
      });

      // Update Enemies
      enemies.forEach((e, ei) => {
        e.y += e.speed;

        // Check Bullet Hit
        bullets.forEach((b, bi) => {
          if (Math.hypot(e.x - b.x, e.y - b.y) < 16) {
            enemies.splice(ei, 1);
            bullets.splice(bi, 1);
            updateScore(score + 10);
          }
        });

        // Direct Ship Collision = GAME OVER
        if (Math.hypot(e.x - playerX, e.y - (canvas.height - 25)) < 22) {
          gameState = 'gameover';
        }

        // Passes harmlessly past screen without ending game
        if (e.y > canvas.height + 20) {
          enemies.splice(ei, 1);
        }
      });
    }

    function drawShooter() {
      // Draw Player
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(playerX, canvas.height - 40);
      ctx.lineTo(playerX + 14, canvas.height - 15);
      ctx.lineTo(playerX - 14, canvas.height - 15);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Bullets
      ctx.fillStyle = '#d4af37';
      bullets.forEach(b => {
        ctx.fillRect(b.x - 2, b.y, 4, 10);
      });

      // Enemies
      ctx.strokeStyle = '#8b929e';
      ctx.fillStyle = '#ef4444';
      enemies.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });
    }

    /* ---------------- GAME 3: GOTHIC PADDLE (PONG) ---------------- */
    let p1Y = 160;
    let p2Y = 160;
    let ball = { x: 200, y: 200, vx: 4, vy: 3 };

    function initPong() {
      p1Y = 160;
      p2Y = 160;
      ball = { x: 200, y: 200, vx: 4, vy: 2 };
      gameState = 'playing';
      updateScore(0);
    }

    function updatePong() {
      if ((keys['ArrowUp'] || keys['KeyW']) && p1Y > 10) p1Y -= 6;
      if ((keys['ArrowDown'] || keys['KeyS']) && p1Y < canvas.height - 70) p1Y += 6;

      // AI Logic
      if (ball.y > p2Y + 30 && p2Y < canvas.height - 70) p2Y += 3.5;
      if (ball.y < p2Y + 30 && p2Y > 10) p2Y -= 3.5;

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y <= 0 || ball.y >= canvas.height - 8) ball.vy *= -1;

      // Player 1 Collision
      if (ball.x <= 30 && ball.y >= p1Y && ball.y <= p1Y + 60) {
        ball.vx = Math.abs(ball.vx) + 0.2;
        updateScore(score + 5);
      }

      // AI Collision
      if (ball.x >= canvas.width - 38 && ball.y >= p2Y && ball.y <= p2Y + 60) {
        ball.vx = -Math.abs(ball.vx);
      }

      if (ball.x < 0) gameState = 'gameover';
      if (ball.x > canvas.width) {
        updateScore(score + 50);
        ball.x = 200;
        ball.y = 200;
        ball.vx = -4;
      }
    }

    function drawPong() {
      // Net
      ctx.strokeStyle = '#232730';
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#d4af37';
      ctx.fillRect(20, p1Y, 10, 60);

      ctx.fillStyle = '#8b929e';
      ctx.fillRect(canvas.width - 30, p2Y, 10, 60);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ball.x, ball.y, 8, 8);
    }

    /* ---------------- MASTER LOOP ---------------- */
    function initGame() {
      if (currentGame === 'snake') initSnake();
      if (currentGame === 'shooter') initShooter();
      if (currentGame === 'pong') initPong();
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameState === 'playing') {
        if (currentGame === 'snake') { updateSnake(); drawSnake(); }
        if (currentGame === 'shooter') { updateShooter(); drawShooter(); }
        if (currentGame === 'pong') { updatePong(); drawPong(); }
      } else {
        // Start / Game Over Screen
        ctx.fillStyle = 'rgba(11, 12, 14, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = '34px "Grenze Gotisch", serif';
        ctx.textAlign = 'center';

        if (gameState === 'start') {
          ctx.fillStyle = '#d4af37';
          ctx.fillText('ENTER THE ARENA', canvas.width / 2, canvas.height / 2 - 20);
          ctx.font = '14px monospace';
          ctx.fillStyle = '#8b929e';
          ctx.fillText('PRESS SPACE OR TAP TO AWAKEN', canvas.width / 2, canvas.height / 2 + 25);
        } else if (gameState === 'gameover') {
          ctx.fillStyle = '#ef4444';
          ctx.fillText('RUN CONCLUDED', canvas.width / 2, canvas.height / 2 - 20);
          ctx.font = '14px monospace';
          ctx.fillStyle = '#d4af37';
          ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
          ctx.fillStyle = '#8b929e';
          ctx.fillText('PRESS SPACE OR TAP TO RETRY', canvas.width / 2, canvas.height / 2 + 50);
        }
      }

      requestAnimationFrame(loop);
    }

    updateScore(0);
    loop();
  </script>
</body>
</html>
