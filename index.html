<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujjwal Kr Swargiary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --card-border: #1f1f24;
      --accent-red: #e11d48;
      --accent-glow: rgba(225, 29, 72, 0.25);
      --text: #f4f4f5;
      --text-muted: #71717a;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(225, 29, 72, 0.12), transparent 45%),
        radial-gradient(#18181b 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), 0 0 50px -15px var(--accent-glow);
      position: relative;
    }

    /* Profile Image with subtle crimson border glow */
    .avatar-wrapper {
      width: 124px;
      height: 124px;
      margin: 0 auto 24px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-red), #27272a);
      box-shadow: 0 0 24px var(--accent-glow);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #18181b;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 8px;
    }

    /* Oma Bedor Vault link */
    .vault-link {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-red);
      text-decoration: none;
      background: rgba(225, 29, 72, 0.08);
      border: 1px solid rgba(225, 29, 72, 0.25);
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 28px;
      transition: all 0.2s ease;
    }

    .vault-link:hover {
      background: var(--accent-red);
      color: #ffffff;
      box-shadow: 0 0 16px var(--accent-glow);
      transform: translateY(-1px);
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--card-border), transparent);
      margin: 0 0 24px;
    }

    /* Social Contact Icons */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #18181b;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      color: var(--accent-red);
      border-color: rgba(225, 29, 72, 0.5);
      background: #201216;
      transform: translateY(-2px);
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Section Tag */
    .section-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Useful Links: Arcade & Tune */
    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .useful-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 12px;
      background: #18181b;
      border: 1px solid var(--card-border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .useful-btn:hover {
      border-color: var(--accent-red);
      background: #1f1418;
      transform: translateY(-2px);
      color: #ffffff;
    }

    .useful-btn span {
      font-size: 1.1rem;
    }
  </style>
</head>
