<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujjwal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #141417;
      --border: #222228;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-hand: 'Caveat', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 48px 20px 28px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Polaroid Photo Frame */
    .polaroid {
      background: #ffffff;
      padding: 14px 14px 18px;
      border-radius: 4px;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.65), 0 2px 8px rgba(0, 0, 0, 0.4);
      transform: rotate(-1.5deg);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: default;
      margin-bottom: 36px;
    }

    .polaroid:hover {
      transform: rotate(0deg) scale(1.02);
      box-shadow: 0 22px 42px rgba(0, 0, 0, 0.85);
    }

    .polaroid img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      display: block;
      border-radius: 2px;
      background-color: #18181b;
    }

    .polaroid-caption {
      font-family: var(--font-hand);
      font-size: 2.2rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 10px;
      line-height: 1;
    }

    /* About Section */
    .about-section {
      margin-bottom: 36px;
    }

    .about-main {
      font-size: 1.08rem;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.5;
    }

    .about-gap {
      margin-top: 14px;
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Links Section */
    .links-section {
      width: 100%;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .section-title::before,
    .section-title::after {
      content: '';
      width: 32px;
      height: 1px;
      background: var(--border);
    }

    .links-grid {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .link-btn:hover {
      background: #1c1c22;
      border-color: #3f3f46;
      transform: translateY(-2px);
      color: #ffffff;
    }

    /* Bottom Footer */
    footer {
      width: 100%;
      max-width: 580px;
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .vault-link {
      color: #52525b;
      text-decoration: none;
      transition: color 0.2s ease;
      font-family: var(--font-body);
    }

    .vault-link:hover {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Polaroid Frame -->
    <div class="polaroid">
      <img src="avatar.png" alt="ujjwal" onerror="this.src='profile.jpg'">
      <div class="polaroid-caption">ujjwal</div>
    </div>

    <!-- About Content -->
    <div class="about-section">
      <p class="about-main">
        Undergraduate student of ECE in 2nd year at CITK.
      </p>
      <p class="about-gap">
        Interested in learning light programming, hardware, and embedded systems.
      </p>
    </div>

    <!-- Other Links -->
    <div class="links-section">
      <div class="section-title">Other Links</div>
      <div class="links-grid">
        
        <!-- Tune (Dynamic handler for local & live) -->
        <a href="https://tune.omabedor.space" id="tuneLink" class="link-btn">
          <span>🎧</span> Tune
        </a>

        <!-- Arcade -->
        <a href="arcade.html" class="link-btn">
          <span>🕹️</span> Arcade
        </a>

      </div>
    </div>

  </div>

  <!-- Bottom Bar -->
  <footer>
    <span>&copy;akarui-uks</span>
    <a href="https://birthday.omabedor.space" class="vault-link" title="...">oma bedor</a>
  </footer>

  <script>
    // Smart redirect for Tune: handles local filesystem vs live site
    document.getElementById('tuneLink').addEventListener('click', function(e) {
      const isLocal = window.location.protocol === 'file:' || 
                      window.location.hostname === 'localhost' || 
                      window.location.hostname === '127.0.0.1';

      if (isLocal) {
        e.preventDefault();
        window.location.href = '../tune/index.html';
      }
    });
  </script>

</body>
</html>
