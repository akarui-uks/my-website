<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUNE — Audio Archive</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Theme color variables */
    :root[data-theme="green"] {
      --bg-base: #121212;
      --bg-surface: #181818;
      --bg-highlight: #282828;
      --accent: #1db954;
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
      --border: #282828;
    }

    :root[data-theme="white"] {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-highlight: #e2e8f0;
      --accent: #0f172a;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #cbd5e1;
    }

    :root[data-theme="red"] {
      --bg-base: #120b0b;
      --bg-surface: #1c1212;
      --bg-highlight: #2d1b1b;
      --accent: #ef4444;
      --text-main: #ffffff;
      --text-sub: #a89f9f;
      --border: #382222;
    }

    :root[data-theme="black"] {
      --bg-base: #000000;
      --bg-surface: #0a0a0a;
      --bg-highlight: #171717;
      --accent: #ffffff;
      --text-main: #ffffff;
      --text-sub: #737373;
      --border: #262626;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 110px; /* Space for sticky bottom player bar */
    }

    /* Top Navigation */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background-color: var(--bg-base);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
      text-decoration: none;
    }

    .back-btn {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: var(--text-main);
    }

    /* Theme Picker Dropdown / Buttons */
    .theme-select-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-btn {
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .theme-btn:hover {
      transform: scale(1.05);
    }

    /* Container */
    .main-content {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Search Bar */
    .search-wrap {
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 12px 18px;
      border-radius: 50px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    /* Track List Table */
    .track-list-header {
      display: grid;
      grid-template-columns: 36px 1fr 60px;
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-sub);
      border-bottom: 1px solid var(--border);
    }

    .track-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .track-row {
      display: grid;
      grid-template-columns: 36px 1fr 60px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .track-row:hover {
      background-color: var(--bg-highlight);
    }

    .track-row.active {
      background-color: var(--bg-highlight);
    }

    .track-row.active .track-title {
      color: var(--accent);
    }

    .track-num {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .track-info-cell {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .track-thumb {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      object-fit: cover;
      background-color: var(--bg-highlight);
      flex-shrink: 0;
    }

    .track-meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-align: left;
    }

    .track-title {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.78rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-time {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-align: right;
    }

    /* Bottom Floating Spotify Player */
    .bottom-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 100;
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 140px;
      max-width: 200px;
    }

    .current-thumb {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      background-color: var(--bg-highlight);
    }

    .current-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .current-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-artist {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .player-center {
      flex: 1;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.1rem;
      cursor: pointer;
      transition: color 0.15s, transform 0.1s;
    }

    .ctrl-btn:hover {
      color: var(--text-main);
      transform: scale(1.1);
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--accent);
      color: var(--bg-base);
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }

    .play-btn:hover {
      transform: scale(1.06);
    }

    .scrub-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-num {
      font-size: 0.72rem;
      color: var(--text-sub);
      min-width: 30px;
    }

    .scrub-bar {
      flex: 1;
      height: 4px;
      background: var(--bg-highlight);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .scrub-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
    }

    @media (max-width: 600px) {
      .player-left {
        max-width: 110px;
      }
      .current-artist {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-nav">
    <div class="brand-group">
      <a href="../index.html" class="back-btn">← Portfolio</a>
      <span class="brand-logo">TUNE</span>
    </div>

    <!-- Theme Switcher -->
    <div class="theme-select-wrap">
      <button class="theme-btn" onclick="setTheme('green')" title="Spotify Green">Green</button>
      <button class="theme-btn" onclick="setTheme('black')" title="Pitch Black">Black</button>
      <button class="theme-btn" onclick="setTheme('white')" title="Clean White">White</button>
      <button class="theme-btn" onclick="setTheme('red')" title="Crimson Red">Red</button>
    </div>
  </header>

  <main class="main-content">
    
    <!-- Search Bar -->
    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="Search tracks or artist..." autocomplete="off">
    </div>

    <!-- Track List -->
    <div class="track-list-header">
      <span>#</span>
      <span>Title</span>
      <span style="text-align: right;">Time</span>
    </div>

    <ul class="track-list" id="trackList">
      <!-- Tracks dynamically rendered from JavaScript array below -->
    </ul>
  </main>

  <!-- Bottom Player Bar -->
  <footer class="bottom-player">
    <div class="player-left">
      <img id="currentThumb" class="current-thumb" src="musicimage1.jpg" alt="Cover" onerror="this.src='../avatar.png'">
      <div class="current-info">
        <span class="current-title" id="currentTitle">Select a track</span>
        <span class="current-artist" id="currentArtist">akarui_uks</span>
      </div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="Previous">⏮</button>
        <button class="play-btn" id="playBtn" aria-label="Play">▶</button>
        <button class="ctrl-btn" id="nextBtn" aria-label="Next">⏭</button>
      </div>

      <div class="scrub-wrap">
        <span class="time-num" id="currTime">0:00</span>
        <div class="scrub-bar" id="scrubBar">
          <div class="scrub-fill" id="scrubFill"></div>
        </div>
        <span class="time-num" id="durTime">0:00</span>
      </div>
    </div>

    <audio id="audioEl" preload="none"></audio>
  </footer>

  <script>
    // =========================================================================
    // ⚙️ EDIT YOUR 10 TRACKS HERE:
    // Change "title", "artist", file name in "src", and image in "cover".
    // =========================================================================
    const tracklist = [
      {
        id: 1,
        title: "Lady Killers II",
        artist: "G-Eazy",
        src: "ladykiller.mp3",
        cover: "ladykiller.webp",
        duration: "4:59"
      },
      {
        id: 2,
        title: "We Fell In Love In October",
        artist: "girl in red",
        src: "wefellinlove.mp3",
        cover: "wefellinlove.webp",
        duration: "3:05"
      },
      {
        id: 3,
        title: ".",
        artist: "girl in red",
        src: "dot.mp3",
        cover: "dot.jpg",
        duration: "2:46"
      },
      {
        id: 4,
        title: "Music 4",
        artist: "akarui_uks",
        src: "music4.mp3",
        cover: "musicimage4.jpg",
        duration: "4:02"
      },
      {
        id: 5,
        title: "Music 5",
        artist: "akarui_uks",
        src: "music5.mp3",
        cover: "musicimage5.jpg",
        duration: "2:55"
      },
      {
        id: 6,
        title: "Music 6",
        artist: "akarui_uks",
        src: "music6.mp3",
        cover: "musicimage6.jpg",
        duration: "3:15"
      },
      {
        id: 7,
        title: "Music 7",
        artist: "akarui_uks",
        src: "music7.mp3",
        cover: "musicimage7.jpg",
        duration: "3:40"
      },
      {
        id: 8,
        title: "Music 8",
        artist: "akarui_uks",
        src: "music8.mp3",
        cover: "musicimage8.jpg",
        duration: "2:50"
      },
      {
        id: 9,
        title: "Music 9",
        artist: "akarui_uks",
        src: "music9.mp3",
        cover: "musicimage9.jpg",
        duration: "4:12"
      },
      {
        id: 10,
        title: "Music 10",
        artist: "akarui_uks",
        src: "music10.mp3",
        cover: "musicimage10.jpg",
        duration: "3:05"
      }
    ];

    let currentIdx = 0;
    let filteredTracks = [...tracklist];

    const audio = document.getElementById('audioEl');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const scrubBar = document.getElementById('scrubBar');
    const scrubFill = document.getElementById('scrubFill');
    const currTime = document.getElementById('currTime');
    const durTime = document.getElementById('durTime');
    const currentTitle = document.getElementById('currentTitle');
    const currentArtist = document.getElementById('currentArtist');
    const currentThumb = document.getElementById('currentThumb');
    const trackListEl = document.getElementById('trackList');
    const searchInput = document.getElementById('searchInput');

    // Theme Switcher Logic
    function setTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('tune_theme', themeName);
    }

    const savedTheme = localStorage.getItem('tune_theme') || 'green';
    setTheme(savedTheme);

    // Render Track Table
    function renderList() {
      trackListEl.innerHTML = '';
      filteredTracks.forEach((t) => {
        const li = document.createElement('li');
        li.className = `track-row ${t.id === tracklist[currentIdx].id ? 'active' : ''}`;
        li.innerHTML = `
          <span class="track-num">${t.id}</span>
          <div class="track-info-cell">
            <img src="${t.cover}" class="track-thumb" alt="${t.title}" onerror="this.src='../avatar.png'">
            <div class="track-meta">
              <span class="track-title">${t.title}</span>
              <span class="track-artist">${t.artist}</span>
            </div>
          </div>
          <span class="track-time">${t.duration}</span>
        `;
        li.addEventListener('click', () => {
          const originalIndex = tracklist.findIndex(item => item.id === t.id);
          loadAndPlay(originalIndex);
        });
        trackListEl.appendChild(li);
      });
    }

    // Load and Play Audio
    function loadAndPlay(index) {
      currentIdx = index;
      const t = tracklist[currentIdx];
      currentTitle.textContent = t.title;
      currentArtist.textContent = t.artist;
      currentThumb.src = t.cover;
      audio.src = t.src;
      
      renderList();
      audio.play().then(() => {
        playBtn.textContent = '❚❚';
      }).catch(() => {});
    }

    // Toggle Play/Pause
    function togglePlay() {
      if (!audio.src) {
        loadAndPlay(0);
        return;
      }
      if (audio.paused) {
        audio.play().then(() => { playBtn.textContent = '❚❚'; }).catch(() => {});
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    }

    function prevTrack() {
      currentIdx = (currentIdx - 1 + tracklist.length) % tracklist.length;
      loadAndPlay(currentIdx);
    }

    function nextTrack() {
      currentIdx = (currentIdx + 1) % tracklist.length;
      loadAndPlay(currentIdx);
    }

    // Search Filtering
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      filteredTracks = tracklist.filter(t => 
        t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)
      );
      renderList();
    });

    // Time update & Scrubbing
    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        const pct = (audio.currentTime / audio.duration) * 100;
        scrubFill.style.width = pct + '%';
        currTime.textContent = formatSec(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      durTime.textContent = formatSec(audio.duration);
    });

    audio.addEventListener('ended', nextTrack);

    scrubBar.addEventListener('click', (e) => {
      const rect = scrubBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      audio.currentTime = (clickX / rect.width) * audio.duration;
    });

    function formatSec(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);

    // Init display
    renderList();
    currentTitle.textContent = tracklist[0].title;
    currentArtist.textContent = tracklist[0].artist;
    currentThumb.src = tracklist[0].cover;
  </script>
</body>
</html>
